---
- name: Update installed packages
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_only: true
  become: true

- name: Install baseline security packages
  ansible.builtin.dnf:
    name:
      - firewalld
      - policycoreutils-python-utils
      - chrony
    state: present
  become: true

- name: Ensure SELinux is enforcing
  ansible.posix.selinux:
    policy: targeted
    state: enforcing
  become: true

- name: Enable and start firewalld
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started
  become: true

- name: Allow SSH only from the jumpbox
  ansible.posix.firewalld:
    rich_rule: 'rule family="ipv4" source address="10.0.4.4/32" service name="ssh" accept'
    zone: public
    permanent: true
    immediate: true
    state: enabled

- name: Remove unrestricted SSH access from the public zone
  ansible.posix.firewalld:
    service: ssh
    zone: public
    permanent: true
    immediate: true
    state: disabled

- name: Enable and start chronyd
  ansible.builtin.systemd:
    name: chronyd
    enabled: true
    state: started
  become: true

- name: Disable root SSH login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
    validate: '/usr/sbin/sshd -t -f %s'
  become: true
  notify: Restart sshd

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    validate: '/usr/sbin/sshd -t -f %s'
  become: true
  notify: Restart sshd

- name: Disable keyboard-interactive authentication
  ansible.builtin.lineinfile:
   path: /etc/ssh/sshd_config
   regexp: '^#?KbdInteractiveAuthentication'
   line: 'KbdInteractiveAuthentication no'
   validate: '/usr/sbin/sshd -t -f %s'
  become: true
  notify: Restart sshd

- name: Disable X11 forwarding
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?X11Forwarding'
    line: 'X11Forwarding no'
    validate: '/usr/sbin/sshd -t -f %s'
  become: true
  notify: Restart sshd

- name: Restrict SSH to azureadmin
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^AllowUsers'
    line: 'AllowUsers azureadmin'
    validate: '/usr/sbin/sshd -t -f %s'
  become: true
  notify: Restart sshd

