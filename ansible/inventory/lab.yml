all:
  children:
    jumpboxes:
      hosts:
        jumpbox:
          ansible_host: "jump_box_IP"
          ansible_user: azureadmin
          ansible_ssh_private_key_file: ~/.ssh/arcgis-jumpbox

    rhel_servers:
      hosts:
        web:
          ansible_host: 10.0.1.10
          server_role: web

        geoserver:
          ansible_host: 10.0.2.10
          server_role: geoserver

        postgis:
          ansible_host: 10.0.3.10
          server_role: postgis